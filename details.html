function getQueryParam(name) {
    var params = new URLSearchParams(window.location.search);
    return params.get(name);
}

function renderArticle(id) {
    var article = articles[id] || articles['1'];
    var container = document.getElementById('articleContainer');
    var titleEl = document.getElementById('articleTitle');
    var categoryEl = document.getElementById('articleCategory');

    titleEl.textContent = article.title;
    categoryEl.textContent = article.category;
    document.title = article.title + ' | أمانة الرياض';

    var html = '';
    article.content.forEach(function(block) {
        if (block.type === 'p') {
            html += '<p>' + block.text + '</p>';
        } else if (block.type === 'h2') {
            html += '<h2>' + block.text + '</h2>';
        } else if (block.type === 'h3') {
            html += '<h3>' + block.text + '</h3>';
        } else if (block.type === 'ul') {
            html += '<ul>';
            block.items.forEach(function(item) {
                html += '<li>' + item + '</li>';
            });
            html += '</ul>';
        } else if (block.type === 'highlight') {
            html += '<div class="article-highlight"><p>' + block.text + '</p></div>';
        }
    });

    html += '<div class="article-cta">';
    html += '<h3>هل تحتاج نقل عفش بالرياض؟</h3>';

    html += '<a href="https://wa.me/966570985400" target="_blank" class="cta-btn cta-btn-whatsapp"><i class="fab fa-whatsapp"></i> 0570985400</a>';
    html += '</div></div>';

    container.innerHTML = html;
}

window.addEventListener('scroll', function() {
    var header = document.getElementById('detailsHeader');
    var scrollTop = window.pageYOffset || document.documentElement.scrollTop;
    if (header) {
        if (scrollTop > 50) {
            header.classList.add('scrolled');
        } else {
            header.classList.remove('scrolled');
        }
    }
});

var observer = new IntersectionObserver(function(entries) {
    entries.forEach(function(entry) {
        if (entry.isIntersecting) {
            entry.target.classList.add('visible');
        }
    });
}, { threshold: 0.15 });

var container = document.getElementById('articleContainer');
if (container) observer.observe(container);
